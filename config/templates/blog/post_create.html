{% extends 'base.html' %}

{% load static %}

{% block title %}BlobLog | New Post{% endblock %}

{% block links %}
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="{% static 'styles/post_create.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.ckeditor.com/ckeditor5/48.5.1/ckeditor5.css">
{% endblock %}

{% block content %}
    <section>
        <form method="post" action="{% url 'blog:post_create' %}" class="form-control" id="postForm">
            {% csrf_token %}
            <div class="container">
                <div class="d-flex">
                    <div class="me-5">
                        <label for="ImageUpload" class="image-upload">
                        <img src="" alt="Upload image">
                        </label>
                        <input type="file" accept="image" id="ImageUpload"class="d-none">
                        </div>
                    <div>
                        <label for="">Title:</label>
                        <input name="title" type="text" class="form-control">
                        <label for="">Category:</label>
                        <select name="category" class="form-select mt-1" aria-label="Default select example">
                        <option selected>Select a Category</option>
                        {% for cat in categories %}
                        <option value="{{ cat.id }}">{{ cat.name }}</option>
                        {% endfor %}
                        </select>
                    </div>
                </div>
            </div>
            <div class="container">
                <div class="mt-3">
                    <div id="editor">
                        <p></p>
                    </div>
                    <textarea name="content" id="content" hidden></textarea>
                </div>
                <button type="submit" class="btn btn-primary p-2 mt-2">Submit</button>
            </div>
        </form>
    </section>
{% endblock %}

{% block scripts %}
    <script src="https://cdn.ckeditor.com/ckeditor5/48.5.1/ckeditor5.umd.js"></script>
	<script src="{% static 'scripts/post_create.js' %}"></script>
{% endblock %}
