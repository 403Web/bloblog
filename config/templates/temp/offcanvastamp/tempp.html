    <link rel="stylesheet" href="{% static 'styles/blog/post_detail.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

        rel="stylesheet">

<body>
    <button class="btn" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasBottom" aria-controls="offcanvasBottom"><i class="bi bi-pencil-square"></i></button>

<div class="offcanvas offcanvas-bottom" tabindex="-1" id="offcanvasBottom" aria-labelledby="offcanvasBottomLabel">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="offcanvasBottomLabel">Edit Comment</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
        <form action=""> 
            <label for="" class="fs-5 my-2">Edit your comment</label>
            <div class="d-flex">
                <input type="text" class="form-control w-75">
                <button class="btn btn-primary" style="width: 10%;">Edit</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
